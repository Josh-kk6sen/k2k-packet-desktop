[package]
name = "k2k-packet-desktop"
version = "0.11.38"
edition = "2021"
# Two binaries ship from this package: the desktop window app (src/main.rs) and
# the GUI-free server (src/bin/k2k-headless.rs). Without this, cargo/tauri-cli
# pick whichever binary they find first and the desktop bundle ends up wrapping
# k2k-headless — a window-less binary in a package whose dependencies assume a
# WebView.
default-run = "k2k-packet-desktop"

[lib]
name = "k2k_packet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `desktop` (default) is the Tauri window build: GTK + WebKitGTK.
# `--no-default-features` links no Tauri at all — that is the headless
# (`k2k-headless` / `--web`) build that installs on a lite Pi in seconds.
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-single-instance"]
# `headless` only enables the extra `k2k-headless` binary target. It is NOT in
# the default set: Tauri's bundler copies every binary in the package into the
# .app/.deb, and the macOS universal build failed on exactly that — it looked
# for target/universal-apple-darwin/release/k2k-headless, which cargo never
# builds unless asked. Keep it out, and build the lean server explicitly with
#   cargo build --release --no-default-features --features headless --bin k2k-headless
headless = []

# The lean, no-GUI-toolkit server. Gated so a normal desktop build/bundle only
# ever contains k2k-packet-desktop.
[[bin]]
name = "k2k-headless"
path = "src/bin/k2k-headless.rs"
required-features = ["headless"]

[dependencies]
chrono = "0.4"
axum = { version = "0.8", features = ["ws"] }
include_dir = "0.7"

tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
opener = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
socket2 = "0.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
