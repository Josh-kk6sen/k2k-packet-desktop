[package]
name = "k2k-packet-desktop"
version = "0.11.12"
edition = "2021"

[lib]
name = "k2k_packet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
opener = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
socket2 = "0.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
