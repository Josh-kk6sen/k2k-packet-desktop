[package]
name = "k2k-packet-desktop"
version = "0.11.36"
edition = "2021"

[lib]
name = "k2k_packet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `desktop` (default) is the Tauri window build: GTK + WebKitGTK.
# `--no-default-features` links no Tauri at all — that is the headless
# (`k2k-headless` / `--web`) build that installs on a lite Pi in seconds.
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-single-instance"]

[dependencies]
chrono = "0.4"
axum = { version = "0.8", features = ["ws"] }
include_dir = "0.7"

tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
opener = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
socket2 = "0.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
