name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 22 required: the frontend smoke test loads jsdom whose
          # transitive dep (@exodus/bytes, via jsdom v30) is ESM-only and
          # crashes Node 20's require(). Node 22 supports require(esm).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Frontend smoke test
        run: npm run test:frontend

  rust:
    name: Rust gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      # Tauri's Linux build needs these system libraries; ubuntu-latest
      # runners don't ship them, so cargo check would fail to link.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  windows-cross:
    name: Windows cross-check (MinGW)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Pinned to 1.99.0: Rust 1.100.0 breaks the Tauri build script for the
      # MinGW target ("No such file or directory" right after resource.lib).
      # Verified on the same commit — 1.99.0 builds clean, 1.100.0 fails.
      # Unpin once Tauri ships a fix.
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-gnu
          rustup default 1.99.0

      - name: Install MinGW cross toolchain (diagnostic)
        run: |
          set +e
          sudo apt-get update
          APT_OUT=$(sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 2>&1)
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "::error::APT FAILED ($EXIT): $(echo "$APT_OUT" | grep -iE 'unable|E:|not found|doesn.t have|404|named package|conflict|depends' | head -3 | tr '\n' ' ')"
            echo "=== full output ==="
            echo "$APT_OUT" | tail -25
            exit $EXIT
          fi

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: cargo check (Windows target)
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: /tmp/k2k-windows-target
        run: cargo check --target x86_64-pc-windows-gnu

  lint:
    name: Clippy + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      # Fails on clippy errors. Warnings are reported but not fatal: the tree
      # currently carries ~109 of them. Flip to `-- -D warnings` once that
      # backlog is cleared.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --message-format short

      # The tree is rustfmt-clean as of the "style: cargo fmt" commit, and the
      # autoformat hook keeps it that way locally. This stops it drifting.
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo deny (advisories, licenses, bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses bans
