name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 required: the frontend smoke test loads jsdom whose
          # transitive dep (@exodus/bytes, via jsdom v30) is ESM-only and
          # crashes Node 20's require(). Node 22 supports require(esm).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Frontend smoke test
        run: npm run test:frontend

  rust:
    name: Rust gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      # Tauri's Linux build needs these system libraries; ubuntu-latest
      # runners don't ship them, so cargo check would fail to link.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  windows-cross:
    name: Windows cross-check (MinGW)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Install MinGW cross toolchain (diagnostic)
        run: |
          set +e
          sudo apt-get update
          APT_OUT=$(sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 2>&1)
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "::error::APT FAILED ($EXIT): $(echo "$APT_OUT" | grep -iE 'unable|E:|not found|doesn.t have|404|named package|conflict|depends' | head -3 | tr '\n' ' ')"
            echo "=== full output ==="
            echo "$APT_OUT" | tail -25
            exit $EXIT
          fi

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: cargo check (Windows target)
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: /tmp/k2k-windows-target
        run: cargo check --target x86_64-pc-windows-gnu