name: Release

# Builds and publishes installers (.deb + .exe) as GitHub Release artifacts
# whenever a version tag (v*) is pushed. The README's "Download from Releases"
# links depend on this producing real binaries.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bundles:
        description: "Bundles to build (comma-separated; default all)"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || contains(github.event.inputs.bundles, 'deb') || contains(github.event.inputs.bundles, 'all')
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Build + package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "K2K Packet Desktop ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          args: --bundles deb

  # Native arm64 build on GitHub's ARM64 runner (ubuntu-24.04-arm, free for
  # public repos). This replaces the ~1h50m qemu cross-build on .249.
  # armhf (32-bit) is NOT built here: GitHub has no 32-bit ARM hosted runner,
  # so Raspberry Pi OS 32-bit / DigiPi packages stay a local qemu build.
  build-linux-arm64:
    name: Build Linux arm64 .deb
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'workflow_dispatch' || contains(github.event.inputs.bundles, 'arm64') || contains(github.event.inputs.bundles, 'all')
    steps:
      - uses: actions/checkout@v5

      # A mislabelled runner would silently produce an x86_64 package.
      - name: Confirm ARM64 host
        run: |
          uname -m
          dpkg --print-architecture
          test "$(dpkg --print-architecture)" = "arm64"

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Build + package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "K2K Packet Desktop ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          args: --bundles deb

      # Guard against the armel/armhf class of packaging bug: assert the control
      # field matches the architecture we actually built for.
      - name: Verify package architecture
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          dpkg-deb -f "$deb" Package Version Architecture Depends
          test "$(dpkg-deb -f "$deb" Architecture)" = "arm64"

  # 32-bit ARM (Raspberry Pi OS 32-bit / DigiPi). GitHub has no armhf hosted
  # runner, so this runs the same armv7 container build used locally, under qemu.
  # This is the ONLY headless package: on every other platform the normal
  # installer already carries both binaries (`--web` runs the window-less
  # server), so there is nothing separate to download.
  # needs: build-linux so the GitHub Release exists before we upload to it.
  build-linux-armhf-headless:
    name: Build Linux armhf headless .deb
    runs-on: ubuntu-latest
    needs: build-linux
    if: github.event_name != 'workflow_dispatch' || contains(github.event.inputs.bundles, 'armhf') || contains(github.event.inputs.bundles, 'all')
    steps:
      - uses: actions/checkout@v5

      # The headless build embeds dist/ at compile time. Build it here so the
      # package can never carry a frontend older than the tag (the container
      # build does not run vite itself).
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Register arm binfmt (qemu)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      # Without a binfmt entry the container silently runs x86 binaries and the
      # failure shows up much later as an architecture error.
      - name: Confirm armv7 emulation
        run: docker run --rm --platform linux/arm/v7 debian:bookworm uname -m | grep -q armv7l

      - name: Build headless armhf .deb
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD":/src:ro \
            -v "$PWD/packaging":/packaging:ro \
            -v "$PWD/out":/out \
            debian:bookworm bash /packaging/build-headless-armhf.sh

      - name: Verify package architecture
        run: |
          deb=$(ls out/*.deb | head -1)
          dpkg-deb -f "$deb" Package Version Architecture Depends
          test "$(dpkg-deb -f "$deb" Architecture)" = "armhf"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" out/*.deb --clobber

  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch' || contains(github.event.inputs.bundles, 'exe') || contains(github.event.inputs.bundles, 'all')
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Build + package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "K2K Packet Desktop ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

  build-macos:
    name: Build macOS .dmg
    runs-on: macos-15
    if: github.event_name != 'workflow_dispatch' || contains(github.event.inputs.bundles, 'dmg') || contains(github.event.inputs.bundles, 'all')
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rust toolchain (both Mac architectures)
        run: |
          rustup update stable && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Ad-hoc signing only (no Apple Developer ID): bundle > macOS >
      # signingIdentity "-" in tauri.conf.json makes the bundler codesign the
      # .app, producing _CodeSignature/CodeResources. Without it the bundle is
      # left unsigned and Gatekeeper reports "damaged, move to Trash".
      # With ad-hoc signing users get the normal "unidentified developer"
      # prompt, where System Settings > Privacy & Security > Open Anyway works.
      - name: Build + package (universal .dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "K2K Packet Desktop ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          args: --bundles dmg --target universal-apple-darwin