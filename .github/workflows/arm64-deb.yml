name: ARM64 .deb

# Builds the 64-bit ARM installer on a native arm64 runner (ubuntu-24.04-arm,
# free for public repositories) instead of the ~1h50m qemu cross-build on .249.
#
# armhf (32-bit) is NOT built here: GitHub has no 32-bit ARM hosted runner.
# That target stays a local qemu build (see arm-building notes in the skill).
#
# Reaches the .deb as a published prerelease asset, so it can be downloaded
# without a token (draft-release assets 404 unauthenticated):
#   curl -L -O https://github.com/<owner>/<repo>/releases/download/arm64-<ver>/<asset>

on:
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note for the prerelease body"
        required: false
        default: ""
  push:
    tags:
      - "arm64-*"

permissions:
  contents: write

jobs:
  build-linux-arm64:
    name: Build Linux arm64 .deb
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Proves the job really landed on an ARM64 host; a mislabelled runner
      # would otherwise silently produce an x86_64 package.
      - name: Confirm ARM64 host
        run: |
          uname -m
          dpkg --print-architecture
          test "$(dpkg --print-architecture)" = "arm64"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Build .deb
        run: npx tauri build --bundles deb

      # Tauri names the package from the target triple. Guard against the
      # armel/armhf class of bug by asserting the control field matches the host.
      - name: Verify package architecture
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          echo "package: $deb"
          dpkg-deb -f "$deb" Package Version Architecture Depends
          test "$(dpkg-deb -f "$deb" Architecture)" = "arm64"
          dpkg-deb -x "$deb" /tmp/pkg
          file /tmp/pkg/usr/bin/k2k-packet-desktop

      - name: Read version
        id: ver
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Publish as prerelease asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arm64-${{ steps.ver.outputs.version }}
          name: "K2K Packet Desktop ARM64 v${{ steps.ver.outputs.version }}"
          body: |
            Native arm64 build. ${{ github.event.inputs.version_note }}

            Install: `sudo apt install ./K2K_Packet_Desktop_*_arm64.deb`
            Headless web client: `k2k-packet-desktop --web --port 8080`
          prerelease: true
          files: src-tauri/target/release/bundle/deb/*.deb
